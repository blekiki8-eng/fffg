<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.header {
  text-align: center;
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
}

.container {
  padding: 20px;
  padding-bottom: 80px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #1e293b;
}

.nav button {
  flex: 1;
  padding: 15px;
  border: none;
  background: none;
  color: white;
  font-size: 14px;
}

.nav button.active {
  background: #334155;
}
</style>
</head>

<body>

<div class="header">🐟 Fish Cash</div>
<div class="container" id="app"></div>

<div class="nav">
  <button id="btnProfile" onclick="profile()">Profile</button>
  <button id="btnFishing" onclick="fishing()">Fishing</button>
  <button id="btnDonate" onclick="donate()">Donate</button>
</div>

<script>
// ================= SAFE INIT =================
Telegram.WebApp?.ready();
Telegram.WebApp?.expand();

// ================= SAVE SYSTEM =================
let fc = parseFloat(localStorage.getItem("fc")) || 100;
let gc = parseFloat(localStorage.getItem("gc")) || 10;

function save(){
  localStorage.setItem("fc", fc);
  localStorage.setItem("gc", gc);
}

// ================= UI ACTIVE =================
function setActive(btnId){
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(btnId).classList.add("active");
}

// ================= PROFILE =================
function profile(){
  setActive("btnProfile");

  let user = Telegram.WebApp?.initDataUnsafe?.user || { id: "guest" };

  document.getElementById("app").innerHTML = `
    <div class="card">
      <h3>👤 Profile</h3>
      ID: ${user.id}<br><br>
      💰 Fish Coin: ${fc.toFixed(2)}<br>
      💎 Gold Coin: ${gc.toFixed(2)}<br><br>
      🔗 Referral: +10 FC за друга
    </div>
  `;
}

// ================= FISHING =================
function fishing(){
  setActive("btnFishing");

  document.getElementById("app").innerHTML = `
    <div class="card">
      <h3>🎣 Fishing</h3>

      Баланс:<br>
      FC: ${fc.toFixed(2)} | GC: ${gc.toFixed(2)}<br><br>

      Ставка:<br>
      <input id="bet" type="number" value="10"><br><br>

      Валюта:<br>
      <select id="cur">
        <option value="fc">Fish Coin</option>
        <option value="gc">Gold Coin</option>
      </select><br><br>

      <button onclick="go()">🎣 Ловити</button>
    </div>
  `;
}

// ================= DONATE =================
function donate(){
  setActive("btnDonate");

  document.getElementById("app").innerHTML = `
    <div class="card">
      <h3>💰 Donate</h3>
      Скоро тут буде донат система
    </div>
  `;
}

// ================= GAME =================
function go(){
  let bet = parseFloat(document.getElementById("bet").value);
  let cur = document.getElementById("cur").value;

  if(isNaN(bet) || bet <= 0){
    alert("Введи правильну ставку");
    return;
  }

  if(cur === "fc" && bet < 10){
    alert("Мінімум 10 FC");
    return;
  }

  if(cur === "gc" && bet < 1){
    alert("Мінімум 1 GC");
    return;
  }

  if(cur === "fc" && fc < bet){
    alert("Недостатньо FC");
    return;
  }

  if(cur === "gc" && gc < bet){
    alert("Недостатньо GC");
    return;
  }

  let win = Math.random() > 0.5;

  let fish = ["🐟 Карась", "🐠 Короп", "🦈 Щука"];
  let trash = ["🗑️ Сміття"];

  let result = win
    ? fish[Math.floor(Math.random() * fish.length)]
    : trash[0];

  if(cur === "fc"){
    fc -= bet;
    if(win) fc += bet * 1.5;
  } else {
    gc -= bet;
    if(win) gc += bet * 1.5;
  }

  save();

  alert(win 
    ? `${result} → Виграш x1.5` 
    : `${result} → Програш`
  );

  fishing();
}

// ================= START =================
profile();
</script>

</body>
</html>
